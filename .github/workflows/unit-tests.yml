name: Unit Tests (host)

on:
  push:
    paths:
      - 'Core/**'
      - 'tests/**'
      - '.github/workflows/unit-tests.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build-essential
        run: sudo apt-get update && sudo apt-get install -y build-essential gcc
      - name: Build utils host test
        run: |
          gcc -ICore/Lib/Inc -Itests Core/Lib/Src/utils.c tests/test_utils.c tests/unity/unity.c -o tests/utils_test
      - name: Run utils tests
        run: ./tests/utils_test
      - name: Build BMP280 compensation test
        run: |
          gcc -std=c11 -Itests tests/test_bmp280.c -o tests/test_bmp280
      - name: Run BMP280 test
        run: ./tests/test_bmp280
      - name: Build sensors logic test
        run: |
          gcc -std=c11 -Itests tests/test_sensors_logic.c -o tests/test_sensors_logic
      - name: Run sensors logic test
        run: ./tests/test_sensors_logic
      - name: Build fan logic test
        run: |
          gcc -std=c11 -Itests tests/test_fan.c -o tests/test_fan
      - name: Run fan logic test
        run: ./tests/test_fan
